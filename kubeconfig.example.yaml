# kubeconfig.example.yaml
#
# This file shows the structure of a kubeconfig file.
# NEVER commit your real kubeconfig — it contains cluster credentials.
#
# In production you do NOT need this file at all:
#   - If the agent runs INSIDE Kubernetes: it uses the in-cluster service account automatically
#   - If the agent runs OUTSIDE Kubernetes (VM/EC2): mount the kubeconfig as a Secret
#     or inject it via your CI/CD pipeline's secret manager
#
# For local development, kubectl uses ~/.kube/config by default.
# Only set KUBECONFIG_PATH in .env if you need a non-default path.

apiVersion: v1
kind: Config
clusters:
- cluster:
    server: https://your-cluster-api-server:6443
    certificate-authority-data: <base64-encoded-ca-cert>
  name: my-cluster
contexts:
- context:
    cluster: my-cluster
    user: my-user
    namespace: default
  name: my-context
current-context: my-context
users:
- name: my-user
  user:
    client-certificate-data: <base64-encoded-client-cert>
    client-key-data: <base64-encoded-client-key>
