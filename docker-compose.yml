services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - KUBECONFIG=/app/kubeconfig-docker.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      # Host 3001 avoids conflict with local `npm run dev` on 3000
      - "3001:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend
