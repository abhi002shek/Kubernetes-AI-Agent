---
# Scenario 1: CrashLoopBackOff — missing required env var
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-loop-demo
  namespace: default
  labels:
    scenario: crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash-loop-demo
  template:
    metadata:
      labels:
        app: crash-loop-demo
    spec:
      containers:
      - name: app
        image: busybox:1.35
        command: ["sh", "-c", "echo Starting; echo DATABASE_URL=$DATABASE_URL; [ -z \"$DATABASE_URL\" ] && echo 'FATAL: DATABASE_URL is not set' && exit 1"]
        # DATABASE_URL intentionally missing
---
# Scenario 2: ImagePullBackOff — invalid image tag
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-pull-demo
  namespace: default
  labels:
    scenario: imagepull
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-pull-demo
  template:
    metadata:
      labels:
        app: image-pull-demo
    spec:
      containers:
      - name: app
        image: nginx:this-tag-does-not-exist-v999
---
# Scenario 3: OOMKilled — memory limit too low for the workload
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
  namespace: default
  labels:
    scenario: oomkilled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-demo
  template:
    metadata:
      labels:
        app: oom-demo
    spec:
      containers:
      - name: app
        image: busybox:1.35
        command: ["sh", "-c", "echo Allocating memory...; dd if=/dev/zero of=/dev/null bs=1M count=500; sleep 30"]
        resources:
          limits:
            memory: "10Mi"
          requests:
            memory: "10Mi"
---
# Scenario 4: Service selector mismatch — service points to wrong labels
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selector-mismatch-demo
  namespace: default
  labels:
    scenario: selectormismatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selector-mismatch-demo
  template:
    metadata:
      labels:
        app: selector-mismatch-demo   # pod has label: app=selector-mismatch-demo
    spec:
      containers:
      - name: app
        image: nginx:1.25
---
apiVersion: v1
kind: Service
metadata:
  name: selector-mismatch-svc
  namespace: default
spec:
  selector:
    app: wrong-label-that-matches-nothing   # intentional mismatch
  ports:
  - port: 80
    targetPort: 80
